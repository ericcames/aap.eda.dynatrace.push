---
# Dynatrace Workflow — triggers on a Davis problem and pushes the event to
# AAP Event-Driven Ansible via the DT-EDA-PUSH connection.
#
# This file is a REFERENCE of the workflow JSON structure. The workflow was
# created via dtctl:
#   dtctl create workflow --file dynatrace/workflow-service-failure.json
#
# The trigger fires on ACTIVE Davis problems (availability, error, resource)
# and sends the full event payload to the EDA Event Stream. The connectionId
# must match the DT-EDA-PUSH EDA connection's objectId.
#
# To list connections and get the objectId:
#   dtctl get settings --schema app:dynatrace.redhat.ansible:eda-webhook.connection
#
# To list workflow executions:
#   dtctl get wfe --workflow <workflow-id>
#
# Workflow ID: b95f0005-dbc2-424d-8ed5-61ebe17498c4 (current dev env)
#
# TRIGGER CONFIG (verified 2026-06-05):
#   - Davis problem trigger, analysisReady: true
#   - Categories: availability, error, resource (not info)
#   - Severity threshold: 3 (captures all severities up to 3)
#   - onProblemClose: false (fires on open only)
#   - uniqueExpression keys on event.id + status + reopen timestamp
#
# TASK: send_to_aap
#   - Action: dynatrace.redhat.ansible:send-event-to-eda
#   - Input: connectionId (the EDA connection objectId) + eventData: {{ event() }}
#
# EVENT SHAPE: the {{ event() }} function returns the full Davis problem event.
# When received by AAP via the Event Stream, the rulebook sees it as:
#   event.payload.<field>
# The exact fields depend on the problem type. Phase 3 captured a test event
# via direct POST; a live Davis problem will include additional fields like
# affected_entity_ids, root_cause_entity, dt.davis.*, etc.
