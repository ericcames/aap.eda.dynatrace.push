---
# EDA credentials for the push model. Two credentials:
#   1. Event Stream Token — validates inbound Bearer tokens from Dynatrace
#   2. Controller — lets the rulebook launch Controller job templates
eda_credentials:
  - name: "{{ eda_event_stream_credential }}"
    organization: "{{ my_organization }}"
    credential_type: "Token Event Stream"
    inputs:
      auth_type: token
      http_header_key: Authorization
      token: "{{ eda_event_stream_token }}"

  - name: "{{ eda_controller_credential }}"
    organization: "{{ my_organization }}"
    credential_type: "Red Hat Ansible Automation Platform"
    inputs:
      host: "{{ controller_cred_host }}/api/controller/"
      username: "{{ controller_cred_username }}"
      password: "{{ controller_cred_password }}"
      verify_ssl: false
