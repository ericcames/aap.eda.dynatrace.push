# Davis problem event shape — captured from a LIVE push event (2026-06-07)
#
# This is the actual payload that arrives in the AAP workflow's dt_push_event
# variable when Dynatrace pushes a Davis problem via the "Send event to EDA"
# Workflow action. Captured from job #589 (workflow) / #590 (triage).
#
# The event is wrapped: dt_push_event.eventData.<fields>
# The triage playbook (dc1.azure/playbooks/dt_triage.yml) unwraps eventData
# first, then extracts the fields below.
#
# KEY GOTCHA: Many field names contain dots (event.name, event.status,
# host.name). In Ansible/Jinja2, these require BRACKET notation:
#   _dt_event['event.name']     — correct
#   _dt_event.event.name        — WRONG (tries to traverse nested dicts)
#
# FIELD MAPPING for triage:
#   Problem ID:      display_id                    → "P-26068"
#   Problem title:   event.name                    → "Process unavailable"
#   Status:          event.status                  → "ACTIVE"
#   Affected entity: affected_entity_names[0]      → "Apache Web Server httpd"
#   Hostname:        host.name[0]                  → FQDN (contains "lnx"/"win")
#   Host entity:     dt.entity.host[0]             → "HOST-E856A4268260CA23"
#   Process group:   dt.entity.process_group_instance[0] → "PROCESS_GROUP_INSTANCE-..."
#   Category:        event.category                → "AVAILABILITY"
#   Severity:        event.severity                → 3
#   Description:     event.description             → markdown narrative
#
# NOTE: For OS detection, use host.name[0] (hostname with lnx/win), NOT
# affected_entity_names[0] (process group name — no OS hint).

