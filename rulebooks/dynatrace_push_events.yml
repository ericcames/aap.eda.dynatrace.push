---
# ============================================================================
# rulebooks/dynatrace_push_events.yml — Dynatrace events, PUSH model
# ============================================================================
# Receives events pushed by Dynatrace Workflows via the AAP Event Stream
# endpoint. The ansible.eda.webhook source listens internally (0.0.0.0:5000);
# the Event Stream handles external auth and proxying.
#
# Variables are injected by the rulebook activation
# (aap_config/files/eda_rulebook_activations.yml):
#   dt_match_pattern / notify_template / remediate_workflow
#   / my_organization ← extra_vars
#
# EVENT SHAPE: the Dynatrace "Send event to Event-Driven Ansible" Workflow
# action sends arbitrary JSON in the POST body. The webhook source wraps it as:
#   event.payload   — the JSON body from Dynatrace
#   event.meta      — request headers (Authorization stripped)
#
# The exact payload fields depend on the Workflow's Event data configuration.
# ============================================================================
- name: React to Dynatrace push events
  hosts: all
  sources:
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000
  rules:
    - name: Launch remediation workflow on a Dynatrace problem event
      condition: event.payload is defined
      action:
        run_workflow_template:
          name: "{{ remediate_workflow }}"
          organization: "{{ my_organization }}"
          job_args:
            extra_vars:
              dt_push_event: "{{ event.payload }}"
