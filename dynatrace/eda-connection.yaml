---
# Dynatrace EDA connection — points the "Send event to Event-Driven Ansible"
# Workflow action at the AAP Event Stream endpoint.
#
# The dtctl settings schema for this connection is:
#   app:dynatrace.redhat.ansible:eda-webhook.connection
#
# This file is a REFERENCE — the connection was created manually in the
# Dynatrace UI (Settings > Connections > Red Hat Ansible > Event-Driven Ansible)
# because the settings schema requires the Event Stream UUID, which is only
# known after aap_config/load.yml creates the Event Stream in AAP.
#
# To recreate via dtctl:
#   dtctl create settings --schema app:dynatrace.redhat.ansible:eda-webhook.connection \
#     --file dynatrace/eda-connection.yaml
#
# To get the Event Stream endpoint URL from AAP:
#   curl -sk -u admin:$PASS "$AAP_HOSTNAME/api/eda/v1/event-streams/" | \
#     python3 -c "import sys,json; [print(f'{r[\"name\"]}: {r[\"uuid\"]}') for r in json.load(sys.stdin)['results']]"
#   Then construct: https://<aap>/eda-event-streams/api/eda/v1/external_event_stream/<uuid>/post/
config:
  - schema: "app:dynatrace.redhat.ansible:eda-webhook.connection"
    scope: environment
    value:
      name: "DT-EDA-PUSH - AAP Event Stream"
      url: "REPLACE_ME_EVENT_STREAM_ENDPOINT_URL"
      token: "REPLACE_ME_EVENT_STREAM_TOKEN"
      type: "api-token"
      eventStreamEnabled: true
